#!/usr/bin/env python3
PACKAGE = "aquaflow_stonefish"
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, int_t, double_t

gen = ParameterGenerator()
modes = gen.enum([gen.const("Off", int_t, 0, "Off"),
                  gen.const("Steady", int_t, 1, "Steady"),
                  gen.const("Blink", int_t, 2, "Blink")], "Light-strip mode")
for side, color in (("left", (0.05, 1.0, 0.10)), ("right", (0.05, 0.30, 1.0))):
    gen.add(side + "_mode", int_t, 0, "0 off, 1 steady, 2 blink", 1, 0, 2, edit_method=modes)
    for channel, default in zip(("r", "g", "b"), color):
        gen.add(side + "_" + channel, double_t, 0,
                "RGB channel; requires Stonefish appearance extension", default, 0.0, 1.0)
    gen.add(side + "_brightness", double_t, 0,
            "Fraction of SCN power; stock backend supports zero/off and full power only",
            1.0, 0.0, 1.0)
    gen.add(side + "_blink_hz", double_t, 0,
            "Full on/off cycles per simulated second", 1.0, 0.1, 5.0)
    gen.add(side + "_duty_cycle", double_t, 0,
            "On fraction of each cycle", 0.5, 0.0, 1.0)
exit(gen.generate(PACKAGE, "led_strip_controller", "LedStrips"))
